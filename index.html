<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TrafficTunes 🎶</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="overlay">
    <div class="container">
      <h1>🚦 TrafficTunes</h1>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
